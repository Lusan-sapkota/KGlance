name: Upload to PPA

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to upload, e.g. v0.1.3'
        required: true

permissions:
  contents: read

jobs:
  ppa:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: kglance

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends devscripts debhelper dput gnupg

      - name: Check tag matches debian/changelog
        working-directory: kglance
        run: |
          DEB_VERSION=$(dpkg-parsechangelog -S Version)
          UPSTREAM=${DEB_VERSION%-*}
          if [ "v$UPSTREAM" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match debian/changelog version $DEB_VERSION"
            exit 1
          fi
          echo "DEB_VERSION=$DEB_VERSION" >> "$GITHUB_ENV"
          echo "UPSTREAM=$UPSTREAM" >> "$GITHUB_ENV"

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
        run: |
          mkdir -m 700 -p ~/.gnupg
          printf '%s' "$GPG_PASSPHRASE" > ~/.gnupg/passphrase
          chmod 600 ~/.gnupg/passphrase
          printf 'batch\npinentry-mode loopback\npassphrase-file %s\n' ~/.gnupg/passphrase > ~/.gnupg/gpg.conf
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "KEY_ID=$KEY_ID" >> "$GITHUB_ENV"

      - name: Build signed source package
        run: |
          # dpkg-source looks for the orig tarball next to the source tree
          git -C kglance archive --prefix="kglance-$UPSTREAM/" -o "$PWD/kglance_$UPSTREAM.orig.tar.gz" HEAD
          # Include every changelog entry since what the PPA already has, so skipped versions show up too.
          PUBLISHED=$(curl -fsS "https://api.launchpad.net/1.0/~lusan/+archive/ubuntu/kglance?ws.op=getPublishedSources&source_name=kglance&exact_match=true&status=Published" \
            | python3 -c "import sys,json; e=json.load(sys.stdin)['entries']; print(e[0]['source_package_version'] if e else '')")
          cd kglance
          dpkg-buildpackage -S -d -k"$KEY_ID" ${PUBLISHED:+-v"$PUBLISHED"}

      - name: Upload to Launchpad
        run: dput ppa:lusan/kglance "kglance_${DEB_VERSION}_source.changes"

      - name: Remove signing key
        if: always()
        run: rm -rf ~/.gnupg
